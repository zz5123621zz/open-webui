server {
    listen 80;
    listen [::]:80;
    server_name chat.la4rain.com;

    root /var/www/acme;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://chat.la4rain.com$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name chat.la4rain.com;

    ssl_certificate /etc/letsencrypt/live/chat.la4rain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.la4rain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Browser uploads are one image at a time (application limit: 12 MiB).
    # The separate CPA vhost must remain at 50m.
    client_max_body_size 13m;
    client_body_timeout 60s;
    send_timeout 600s;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering "no" always;
    }
}

name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/owui-personal-slim
  HERMES_TEST_IMAGE: nousresearch/hermes-agent@sha256:8b4aac05369e6c30132ccaf2d2dab895f4e0cd7a67b44c570996363ff2d6933d

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm audit --audit-level=moderate
        working-directory: web
      - run: npm run check && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - name: Test Hermes bridge plugin
        run: python3 -m unittest integrations.hermes.slim_restaurant_bridge.test_bridge
      - name: Verify plugin with Hermes 0.19.0
        run: |
          docker run --rm --entrypoint python \
            --volume "$GITHUB_WORKSPACE/integrations/hermes/slim_restaurant_bridge:/plugin:ro" \
            "$HERMES_TEST_IMAGE" \
            /plugin/verify_hermes_runtime.py
      - name: Validate Compose configuration
        run: APP_IMAGE=ghcr.io/example/owui-personal-slim:test docker compose config --quiet
      - name: Validate Volcengine TTS deployment wiring
        env:
          APP_IMAGE: ghcr.io/example/owui-personal-slim:test
        run: |
          docker compose \
            -f compose.yaml \
            -f compose.tts-volcengine.yaml \
            config --quiet
          docker compose \
            -f compose.yaml \
            -f compose.tts-volcengine.yaml \
            config --format json |
            jq -e '
              .services.app.environment.TTS_VOLCENGINE_API_KEY_FILE ==
                "/run/secrets/tts_volcengine_api_key" and
              .services.app.environment.TTS_VOLCENGINE_RESOURCE_ID ==
                "seed-tts-2.0" and
              ([.services.app.secrets[]?.source] |
                index("tts_volcengine_api_key") != null) and
              (.secrets.tts_volcengine_api_key.file |
                endswith("/secrets/tts_volcengine_api_key"))
            '
      - name: Validate deployment scripts
        run: sh -n deploy/*.sh
      - run: go test ./... && go vet ./...
      - run: go test -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  image:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4.5.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test built image
        env:
          SMOKE_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          set -euo pipefail
          smoke_root=$(mktemp -d)
          container_name="owui-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker logs "$container_name" 2>&1 || true
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            rm -rf "$smoke_root"
            exit "$status"
          }
          trap cleanup EXIT

          printf '%s' 'ci-app-secret-0123456789-0123456789' \
            >"$smoke_root/app_secret"
          printf '%s' 'ci-provider-key' >"$smoke_root/provider_api_key"
          printf '%s' 'ci-volcengine-key' >"$smoke_root/tts_volcengine_api_key"
          chmod 0444 "$smoke_root"/*

          docker run --detach \
            --name "$container_name" \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777 \
            --tmpfs /data:rw,nosuid,nodev,size=64m,mode=0700,uid=65532,gid=65532 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 100 \
            --memory 320m \
            --cpus 1 \
            --publish 127.0.0.1::8080 \
            --mount \
              "type=bind,src=$smoke_root/app_secret,dst=/run/secrets/app_secret,readonly" \
            --mount \
              "type=bind,src=$smoke_root/provider_api_key,dst=/run/secrets/provider_api_key,readonly" \
            --mount \
              "type=bind,src=$smoke_root/tts_volcengine_api_key,dst=/run/secrets/tts_volcengine_api_key,readonly" \
            --env APP_ENV=production \
            --env APP_BASE_URL=http://127.0.0.1:8080 \
            --env APP_DATA_DIR=/data \
            --env APP_SECRET_FILE=/run/secrets/app_secret \
            --env HTTP_ADDR=:8080 \
            --env AI_PROVIDER=cpa \
            --env AI_BASE_URL=http://127.0.0.1:9/v1 \
            --env AI_API_KEY_FILE=/run/secrets/provider_api_key \
            --env AI_DEFAULT_MODEL=gpt-5.6-sol \
            --env RESTAURANT_GUIDANCE_ENABLED=true \
            --env TTS_VOLCENGINE_API_KEY_FILE=/run/secrets/tts_volcengine_api_key \
            --env TTS_VOLCENGINE_RESOURCE_ID=seed-tts-2.0 \
            --env GOMEMLIMIT=220MiB \
            --env GOGC=75 \
            "$SMOKE_IMAGE"

          smoke_port=$(docker port "$container_name" 8080/tcp | sed 's/.*://')
          smoke_url="http://127.0.0.1:$smoke_port"
          for _ in $(seq 1 30); do
            if curl --fail --silent "$smoke_url/readyz" >/dev/null; then
              break
            fi
            [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" = true ]
            sleep 1
          done

          curl --fail --silent "$smoke_url/healthz" >/dev/null
          curl --fail --silent "$smoke_url/readyz" |
            jq -e '.status == "ready"'
          curl --fail --silent "$smoke_url/api/v1/config/public" |
            jq -e '
              .provider == "cpa" and
              .restaurantGuidanceEnabled == true
            '
          curl --fail --silent \
            --output "$smoke_root/index.html" \
            "$smoke_url/"
          grep -qi '<html' "$smoke_root/index.html"
          bridge_status=$(
            curl --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header 'Content-Type: application/json' \
              --data '{}' \
              "$smoke_url/api/v1/integrations/hermes/restaurant/turn"
          )
          [ "$bridge_status" = 401 ]
          docker exec "$container_name" /app/server healthcheck
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

name: owui-personal-slim

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env}
    container_name: owui-personal-slim
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:8080"
    environment:
      APP_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:-https://chat.la4rain.com}
      APP_DATA_DIR: /data
      APP_SECRET_FILE: /run/secrets/app_secret
      HTTP_ADDR: :8080
      AI_PROVIDER: cpa
      AI_BASE_URL: ${AI_BASE_URL:-https://cpa.la4rain.com/v1}
      AI_API_KEY_FILE: /run/secrets/provider_api_key
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-gpt-5.6-sol}
      AI_MODEL_ALLOWLIST: ${AI_MODEL_ALLOWLIST:-}
      AI_MODEL_DENYLIST: ${AI_MODEL_DENYLIST:-}
      AI_MODELS_TIMEOUT_SECONDS: "5"
      AI_UNKNOWN_MODEL_CONTEXT_TOKENS: ${AI_UNKNOWN_MODEL_CONTEXT_TOKENS:-128000}
      AI_MODEL_CONTEXT_OVERRIDES_JSON: ${AI_MODEL_CONTEXT_OVERRIDES_JSON:-{}}
      AI_RESPONSE_IMAGE_MODELS: ${AI_RESPONSE_IMAGE_MODELS:-}
      AI_DEDICATED_IMAGE_MODELS_JSON: ${AI_DEDICATED_IMAGE_MODELS_JSON:-}
      AI_IMAGE_PROMPT_MAX_BYTES: ${AI_IMAGE_PROMPT_MAX_BYTES:-8000}
      AI_DEFAULT_REASONING_EFFORT: ${AI_DEFAULT_REASONING_EFFORT:-high}
      AI_REQUEST_BODY_MAX_BYTES: "52428800"
      PROVIDER_MAX_CONCURRENT_PER_USER: "2"
      PROVIDER_MAX_CONCURRENT_GLOBAL: "4"
      PROVIDER_MAX_QUEUED_PER_USER: "2"
      PROVIDER_QUEUE_TIMEOUT_SECONDS: "60"
      TOOL_WEB_SEARCH_ENABLED: "true"
      TOOL_IMAGE_GENERATION_ENABLED: "true"
      GOMEMLIMIT: 220MiB
      GOGC: "75"
    secrets:
      - app_secret
      - provider_api_key
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 320m
    mem_reservation: 128m
    cpus: 1.0
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  app_secret:
    file: ./secrets/app_secret
  provider_api_key:
    file: ./secrets/provider_api_key
